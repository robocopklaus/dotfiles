# Which keys the 1Password SSH agent may offer (§6.5).
#
# Without this file the agent's default covers the built-in vaults only — Personal, Private
# and Employee. The project keys live in Shared, so a server that authenticates with one of
# them is unreachable while 1Password holds its key and never offers it.
#
# The file is an allowlist, not an addition: once it exists the default no longer applies,
# which is why Employee is named here although the default already covered it. Dropping that
# entry would take the GitHub key away from the agent, silently.
#
# Vaults, never items. An item name would write a client's name into a public tree, which is
# the one fact §6.5 exists to keep out of it. The ordering an item list would buy is not
# needed: the live keys are under the six-attempt limit an SSH server imposes by default, so
# there is nothing for an order to protect.

[[ssh-keys]]
vault = "Employee"

[[ssh-keys]]
vault = "Shared"
