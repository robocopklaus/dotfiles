# Amethyst reads this at launch; restart it to pick up a change.
#
# Only what differs from Amethyst's defaults. The modifiers are left unset on purpose:
# they are Amethyst's own (option+shift, option+shift+control), clear of
# InstantSpaceSwitcher's control+number and control+arrow, and restating a default
# value here is what Amethyst issue 1419 says can stop a binding from working.

layouts:
  - tall
  - fullscreen

# Applications that keep floating, by bundle identifier. An entry is added when tiling an
# application gets in the way, not ahead of it.
floating:
  - com.apple.systempreferences # System Settings: fixed-width panes, never meant to tile

# Focus follows the pointer. Its counterpart, mouse-follows-focus, is off: Amethyst's docs
# call the two largely incompatible, and together they pulled the pointer off a Dock
# icon's menu into the middle of a window. The cost is accepted: focus moved by key leaves
# the pointer over the old window, and the next nudge of the mouse takes focus back.
# The off is stated although it is the default, because only a key set here overwrites
# the value a machine already holds in Amethyst's preferences.
focus-follows-mouse: true
mouse-follows-focus: false
