# Amethyst reads this at launch; restart it to pick up a change. Settings changed in
# Amethyst's preferences window are overwritten by this file at the next launch for
# every key set here; change them here.
#
# Only what differs from Amethyst's defaults. The modifiers are left unset on purpose:
# they are Amethyst's own (option+shift, option+shift+control), clear of
# InstantSpaceSwitcher's control+number and control+arrow, and restating a default
# value here is what Amethyst issue 1419 says can stop a binding from working.

layouts:
  - tall
  - fullscreen

# Each space keeps the layout it had across a restart. macOS reopening the windows puts
# the applications back on their spaces; the window order within a space is not restored.
restore-layouts-on-launch: true

# Switching spaces does not flash the layout's name; the layout is already visible in how
# the windows sit. Cycling layouts still shows it, since that is a change asked for.
enables-layout-hud-on-space-change: false

# Applications that keep floating, by bundle identifier. An entry is added when tiling an
# application gets in the way, not ahead of it.
floating:
  - com.apple.systempreferences # System Settings: fixed-width panes, never meant to tile
  - com.1password.1password # 1Password: opened briefly to look something up; tiling it reshuffles the working windows
