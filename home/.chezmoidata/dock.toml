# The Dock's layout (§6.4, ADR 0009).
#
# Beside `macos-defaults.toml` and deliberately not inside it. The two share the
# `com.apple.dock` domain but not their shape: that table is flat `domain/key/type/value`
# and ADR 0002 depends on the flatness, which an ordered structure would spend.
#
# Ordered categories of applications, never a literal tile sequence. Spacers are
# **generated** after each category that still has a member, so a category emptied by a
# future review — or by a cask that never landed — leaves no stray separator behind. The
# annual review reasons about whether an application still belongs under Communication;
# it should never have to keep six separators consistent by hand.
#
# An entry is the application's **bundle name**, which is a *reference* to an application
# the repository already declares and never a second declaration of it. CI enforces the
# direction: every name here must resolve to a Brewfile entry or to an Apple system
# application (§8). The check is not precautionary — `zen` was cut from the inventory and
# was still sitting fifth in the prior Dock declaration.
#
# The path is not declared: the name is looked for under `/Applications` and then
# `/System/Applications`, which is the second list this file refuses to become.

[[dock.categories]]
name = "Media"
apps = ["Music"]

[[dock.categories]]
name = "Browsers"
apps = ["Safari", "Google Chrome"]

[[dock.categories]]
name = "Communication"
apps = ["Mail", "Mimestream", "Slack", "Messages", "WhatsApp"]

[[dock.categories]]
name = "Work"
apps = ["ChatGPT", "Claude", "GCal for Google Calendar", "Calendar", "Obsidian"]

[[dock.categories]]
name = "Development"
apps = ["Visual Studio Code", "Ghostty"]

[[dock.categories]]
name = "System"
apps = ["System Settings"]

# The two folders close the sequence, each with the display options its tile carries:
# dockutil's `--view`, `--sort` and `--display`, in that spelling. `${HOME}` is the one
# token a path may carry, expanded where the path is used — the same rule the defaults
# declaration follows.
[[dock.folders]]
path = "/Applications"
view = "auto"
sort = "name"
display = "folder"

[[dock.folders]]
path = "${HOME}/Downloads"
view = "auto"
sort = "dateadded"
display = "folder"
