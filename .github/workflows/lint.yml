name: Lint

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    # Both tiers run on macOS: the source tree is templated for darwin, so a Linux runner
    # would render the branch this repository never applies and lint the wrong shell.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # On PATH for the steps after it, because tests/check.sh asks the machine for chezmoi
      # the way it would at a desk.
      - name: Install chezmoi
        run: |
          sh -c "$(curl -fsLS https://get.chezmoi.io)" -- -b "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Install shellcheck
        run: command -v shellcheck >/dev/null || brew install shellcheck

      # The Dock reference check reads Homebrew's cask metadata with it, as drift does.
      - name: Install jq
        run: command -v jq >/dev/null || brew install jq

      - name: Dry-run apply
        run: >
          "$RUNNER_TEMP/bin/chezmoi" apply --dry-run --verbose
          --source .
          --destination "$RUNNER_TEMP/home"

      # Rendering, the lint, the script headers and every test: the one list, which a run
      # at a desk reads too. What each step is for is written beside it there.
      - name: Check
        run: tests/check.sh

      # Presence only — what the reason says is never judged, because a check that
      # graded it would be satisfied by "# tool" and would have to be argued with.
      - name: Brewfile reason comments
        run: |
          # Both inventories: the convention applies to the work group unchanged, and that
          # is the one file where the comments are themselves the leak surface.
          if grep -vE '^[[:space:]]*(#|$)' Brewfile Brewfile.work | grep -vE '#[[:space:]]*[^[:space:]]'; then
            echo 'The entries above carry no reason comment.'
            exit 1
          fi

      # The inventory's reader, rendered as the scripts include it, so the two checks below
      # read the entry shape the Packages phase and drift read rather than a copy of it.
      # Rendered once into a file: a render that fails then fails here, by name, where a
      # `source <(…)` would hand the checks an empty reader and let them pass.
      - name: Render the inventory reader
        run: |
          mkdir -p "$RUNNER_TEMP/lib"
          "$RUNNER_TEMP/bin/chezmoi" execute-template --source . \
            '{{ template "lib/inventory.sh" . }}' >"$RUNNER_TEMP/lib/inventory.sh"

      # Homebrew moves packages between kinds: `azure-cli` left homebrew/core for
      # homebrew/cask, and the declaration as a formula surfaced only as a failed install
      # on a bootstrap. The taps are read out of the inventories and trusted as the Packages phase trusts
      # them, so a tapped formula resolves here as it does there. The runner image does
      # not refresh Homebrew's package data on its own, and a check against the image's
      # copy would miss exactly the moves it is here for, so it is refreshed first.
      - name: Brewfile entries resolve
        run: |
          . "$RUNNER_TEMP/lib/inventory.sh"
          status=0
          brew update --quiet
          inventories=$(cat Brewfile Brewfile.work)
          inventory_trust_taps <<<"$inventories"
          for tap in $(inventory_entries tap <<<"$inventories"); do
            brew tap "$tap"
          done
          for inventory in Brewfile Brewfile.work; do
            # The entry kind is the Brewfile's keyword; `brew info` spells a formula out.
            for kind in brew cask; do
              flag=${kind/brew/formula}
              while IFS= read -r name; do
                if ! error=$(brew info --"$flag" --json=v2 "$name" 2>&1 >/dev/null); then
                  echo "$inventory: '$name' is declared as a $flag and is not one."
                  printf '%s\n' "$error" | sed 's/^/  /'
                  status=1
                fi
              done < <(inventory_entries "$kind" <"$inventory")
            done
          done
          exit "$status"

      # A Dock entry is a reference to an application the repository already declares,
      # never a second declaration of it — so every name in the declaration must resolve
      # to a Brewfile entry or to an Apple system application. The check is not
      # precautionary: `zen` was cut from the inventory and was still sitting fifth in the
      # prior Dock declaration.
      - name: Dock entry references
        run: |
          . "$RUNNER_TEMP/lib/inventory.sh"
          status=0
          # The bundle each declared cask installs, asked of Homebrew rather than guessed
          # from the cask's token: `telegram-desktop` and `microsoft-teams` are the
          # examples that defeat guessing, and drift asks the same question the same way
          # for the same reason. The App Store entries name their bundle directly.
          casks=$(inventory_entries cask <Brewfile)
          # shellcheck disable=SC2086
          cask_apps=$(brew info --cask --json=v2 $casks |
            jq -r '[.casks[].artifacts | .. | strings] | .[] | select(endswith(".app"))' |
            sed 's|.*/||; s|\.app$||')
          store_apps=$(inventory_entries mas <Brewfile | cut -d' ' -f2-)
          while IFS= read -r name; do
            [ -n "$name" ] || continue
            if grep -qxF "$name" <<<"$cask_apps" || grep -qxF "$name" <<<"$store_apps"; then
              continue
            fi
            # Or an application macOS itself ships: under /System/Applications, or — as
            # Safari is — at a path there that Apple signs. The bundle is asked rather
            # than a list of exceptions this file would then have to maintain: guards
            # derive from the machine, not from a list.
            if [ -d "/System/Applications/$name.app" ]; then
              continue
            fi
            if codesign -dvv "/Applications/$name.app" 2>&1 |
              grep -qxF 'Authority=macOS Software Signing'; then
              continue
            fi
            echo "Dock entry '$name' resolves to no Brewfile entry and no Apple system application."
            status=1
          done < <(
            "$RUNNER_TEMP/bin/chezmoi" execute-template --source . \
              '{{ range .dock.categories }}{{ range .apps }}{{ . }}{{ "\n" }}{{ end }}{{ end }}'
          )
          exit "$status"
