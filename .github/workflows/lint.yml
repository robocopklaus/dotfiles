name: Lint

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: macos-26 # §8
    steps:
      - uses: actions/checkout@v4

      - name: Install chezmoi
        run: sh -c "$(curl -fsLS https://get.chezmoi.io)" -- -b "$RUNNER_TEMP/bin"

      - name: Install shellcheck
        run: command -v shellcheck >/dev/null || brew install shellcheck

      - name: Dry-run apply
        run: >
          "$RUNNER_TEMP/bin/chezmoi" apply --dry-run --verbose
          --source .
          --destination "$RUNNER_TEMP/home"

      # Sources are .tmpl, so the tier renders them first: a template that fails to
      # render is caught a step earlier than one that renders to broken shell. §8
      - name: Render scripts
        run: |
          mkdir -p "$RUNNER_TEMP/rendered"
          for template in home/.chezmoiscripts/*.tmpl; do
            rendered="$RUNNER_TEMP/rendered/$(basename "$template" .tmpl)"
            "$RUNNER_TEMP/bin/chezmoi" execute-template --source . < "$template" > "$rendered"
          done

      # drift is shell too, and the one piece of it a human runs by hand, so it is
      # rendered and linted with the phase scripts. It is kept out of the directory the
      # header check reads: it is a command, not a phase, so it carries no phase header. §7
      - name: Render drift
        run: |
          mkdir -p "$RUNNER_TEMP/rendered-bin"
          "$RUNNER_TEMP/bin/chezmoi" execute-template --source . \
            < home/dot_local/bin/executable_drift.tmpl > "$RUNNER_TEMP/rendered-bin/drift.sh"

      - name: Shellcheck rendered scripts
        run: shellcheck "$RUNNER_TEMP"/rendered/*.sh "$RUNNER_TEMP"/rendered-bin/*.sh tests/*.sh

      # drift's own logic, against stubbed inventories. What the machine actually holds is
      # the end-to-end tier's question, and the report is its oracle. §8
      - name: Test drift
        run: tests/drift.sh "$RUNNER_TEMP/rendered-bin/drift.sh"

      # Presence only — what the reason says is never judged, because a check that
      # graded it would be satisfied by "# tool" and would have to be argued with. §6.1
      - name: Brewfile reason comments
        run: |
          if grep -vE '^[[:space:]]*(#|$)' Brewfile | grep -vE '#[[:space:]]*[^[:space:]]'; then
            echo 'The entries above carry no reason comment (§6.1).'
            exit 1
          fi

      # Presence only — the prose is never read. §4
      - name: Script headers
        run: |
          status=0
          for rendered in "$RUNNER_TEMP"/rendered/*.sh; do
            for field in '# Phase:' '# Requires:'; do
              if ! grep -q "^$field" "$rendered"; then
                echo "$(basename "$rendered"): missing '$field' header field"
                status=1
              fi
            done
          done
          exit "$status"
