name: Lint

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: macos-26 # §8
    steps:
      - uses: actions/checkout@v4

      - name: Install chezmoi
        run: sh -c "$(curl -fsLS https://get.chezmoi.io)" -- -b "$RUNNER_TEMP/bin"

      - name: Install shellcheck
        run: command -v shellcheck >/dev/null || brew install shellcheck

      # The Dock reference check reads Homebrew's cask metadata with it, as drift does.
      - name: Install jq
        run: command -v jq >/dev/null || brew install jq

      - name: Dry-run apply
        run: >
          "$RUNNER_TEMP/bin/chezmoi" apply --dry-run --verbose
          --source .
          --destination "$RUNNER_TEMP/home"

      # Sources are .tmpl, so the tier renders them first: a template that fails to
      # render is caught a step earlier than one that renders to broken shell. §8
      - name: Render scripts
        run: |
          mkdir -p "$RUNNER_TEMP/rendered"
          for template in home/.chezmoiscripts/*.tmpl; do
            rendered="$RUNNER_TEMP/rendered/$(basename "$template" .tmpl)"
            "$RUNNER_TEMP/bin/chezmoi" execute-template --source . < "$template" > "$rendered"
          done

      # drift is shell too, and the one piece of it a human runs by hand, so it is
      # rendered and linted with the phase scripts. It is kept out of the directory the
      # header check reads: it is a command, not a phase, so it carries no phase header. §7
      - name: Render drift
        run: |
          mkdir -p "$RUNNER_TEMP/rendered-bin"
          "$RUNNER_TEMP/bin/chezmoi" execute-template --source . \
            < home/dot_local/bin/executable_drift.tmpl > "$RUNNER_TEMP/rendered-bin/drift.sh"

      - name: Shellcheck rendered scripts
        run: shellcheck "$RUNNER_TEMP"/rendered/*.sh "$RUNNER_TEMP"/rendered-bin/*.sh tests/*.sh

      # drift's own logic, against stubbed inventories. What the machine actually holds is
      # the end-to-end tier's question, and the report is its oracle. §8
      - name: Test drift
        run: tests/drift.sh "$RUNNER_TEMP/rendered-bin/drift.sh"

      # Which identity a remote selects, asked of the real git against the rendered
      # configuration. A pattern that looks right and matches nothing is silent everywhere
      # else: with no default, it surfaces as a refused commit far from here. §6.5, ADR 0011
      - name: Test identity selection
        run: |
          "$RUNNER_TEMP/bin/chezmoi" execute-template --source . \
            < home/dot_gitconfig.tmpl > "$RUNNER_TEMP/rendered-bin/gitconfig"
          tests/identity.sh "$RUNNER_TEMP/rendered-bin/gitconfig" \
            home/dot_config/git/config-personal \
            home/dot_config/git/config-company

      # Presence only — what the reason says is never judged, because a check that
      # graded it would be satisfied by "# tool" and would have to be argued with. §6.1
      - name: Brewfile reason comments
        run: |
          # Both inventories: the convention applies to the work group unchanged, and that
          # is the one file where the comments are themselves the leak surface (§6.1).
          if grep -vE '^[[:space:]]*(#|$)' Brewfile Brewfile.work | grep -vE '#[[:space:]]*[^[:space:]]'; then
            echo 'The entries above carry no reason comment (§6.1).'
            exit 1
          fi

      # A Dock entry is a reference to an application the repository already declares,
      # never a second declaration of it — so every name in the declaration must resolve
      # to a Brewfile entry or to an Apple system application. The check is not
      # precautionary: `zen` was cut from the inventory and was still sitting fifth in the
      # prior Dock declaration. §6.4
      - name: Dock entry references
        run: |
          status=0
          # The bundle each declared cask installs, asked of Homebrew rather than guessed
          # from the cask's token: `telegram-desktop` and `microsoft-teams` are the
          # examples that defeat guessing, and drift asks the same question the same way
          # for the same reason (§7). The App Store entries name their bundle directly.
          casks=$(sed -n 's/^cask "\([^"]*\)".*/\1/p' Brewfile)
          # shellcheck disable=SC2086
          cask_apps=$(brew info --cask --json=v2 $casks |
            jq -r '[.casks[].artifacts | .. | strings] | .[] | select(endswith(".app"))' |
            sed 's|.*/||; s|\.app$||')
          store_apps=$(sed -n 's/^mas "\([^"]*\)".*/\1/p' Brewfile)
          while IFS= read -r name; do
            [ -n "$name" ] || continue
            if grep -qxF "$name" <<<"$cask_apps" || grep -qxF "$name" <<<"$store_apps"; then
              continue
            fi
            # Or an application macOS itself ships: under /System/Applications, or — as
            # Safari is — at a path there that Apple signs. The bundle is asked rather
            # than a list of exceptions this file would then have to maintain (rule 6).
            if [ -d "/System/Applications/$name.app" ]; then
              continue
            fi
            if codesign -dvv "/Applications/$name.app" 2>&1 |
              grep -qxF 'Authority=macOS Software Signing'; then
              continue
            fi
            echo "Dock entry '$name' resolves to no Brewfile entry and no Apple system application (§6.4)."
            status=1
          done < <(
            "$RUNNER_TEMP/bin/chezmoi" execute-template --source . \
              '{{ range .dock.categories }}{{ range .apps }}{{ . }}{{ "\n" }}{{ end }}{{ end }}'
          )
          exit "$status"

      # Presence only — the prose is never read. §4
      - name: Script headers
        run: |
          status=0
          for rendered in "$RUNNER_TEMP"/rendered/*.sh; do
            for field in '# Phase:' '# Requires:'; do
              if ! grep -q "^$field" "$rendered"; then
                echo "$(basename "$rendered"): missing '$field' header field"
                status=1
              fi
            done
          done
          exit "$status"
